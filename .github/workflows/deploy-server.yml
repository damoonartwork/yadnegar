# استقرار سرور حساب‌ها (Cloudflare Worker) با هر تغییر در پوشهٔ server
# Secrets لازم در GitHub: CLOUDFLARE_API_TOKEN، SMTP_USER (آدرس جیمیل)، SMTP_PASS (App Password جیمیل)
name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret in Settings → Secrets and variables → Actions"
            exit 1
          fi

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Apply database schema
        run: npx wrangler d1 execute yadnegar --remote --file=schema.sql --yes

      - name: Deploy worker
        run: npx wrangler deploy | tee deploy.log

      - name: Set email secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            printf '%s' "$SMTP_USER" | npx wrangler secret put SMTP_USER
            printf '%s' "$SMTP_PASS" | npx wrangler secret put SMTP_PASS
          else
            echo "::warning::SMTP_USER / SMTP_PASS not set — login emails cannot be sent yet"
          fi

      - name: Server address
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Server: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Server URL: $URL"
          curl -fsS "$URL/health" || true
