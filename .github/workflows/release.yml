# ساخت خودکار نصب‌کنندهٔ ویندوز و انتشار در GitHub Releases
# برای نسخهٔ جدید: نسخهٔ package.json را بالا ببر، سپس یک تگ مثل v1.4.0 بساز و push کن.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
