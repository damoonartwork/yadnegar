# ساخت خودکار نصب‌کنندهٔ ویندوز و انتشار در GitHub Releases
# با هر push به main اجرا می‌شود. اگر شمارهٔ version در package.json جدید باشد،
# electron-builder خودش تگ vX.Y.Z و Release را می‌سازد؛ اگر آن نسخه قبلاً منتشر شده باشد، فقط رد می‌شود.
name: Release

on:
  push:
    branches:
      - main
    # تغییرهای فقط-سرور نسخهٔ جدید برنامه نمی‌سازند
    paths-ignore:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
      - ".github/workflows/voice-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Attach Android APK to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK="android-release/Yadnegar-Android-${VERSION}.apk"
          if [ -f "$APK" ]; then
            gh release upload "v${VERSION}" "$APK" --clobber
          else
            echo "No APK for ${VERSION}; skipping"
          fi
